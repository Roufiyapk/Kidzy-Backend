name: Kidzy Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Kidzy.API/**'
      - 'Kidzy.Application/**'
      - 'Kidzy.Domain/**'
      - 'Kidzy.Infrastructure/**'
      - 'Kidzy.slnx'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: kidzy-backend
          IMAGE_TAG: latest
        run: |
          docker build \
            -f Kidzy.API/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 using SSM
        env:
          AWS_REGION: ap-south-1
          INSTANCE_ID: i-0feaf09bfa8dd0bd0
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 428270342093.dkr.ecr.ap-south-1.amazonaws.com",
              "sudo docker pull 428270342093.dkr.ecr.ap-south-1.amazonaws.com/kidzy-backend:latest",
              "sudo docker stop kidzy-backend || true",
              "sudo docker rm kidzy-backend || true",
              "sudo docker run -d --name kidzy-backend --restart unless-stopped --env-file /home/ubuntu/kidzy-env-final.txt -p 8080:8080 428270342093.dkr.ecr.ap-south-1.amazonaws.com/kidzy-backend:latest",
              "sudo docker image prune -f"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text

              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out. Check Systems Manager for details."
          exit 1
