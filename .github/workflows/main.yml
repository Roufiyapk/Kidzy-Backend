name: Kidzy Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Kidzy.API/**'
      - 'Kidzy.Application/**'
      - 'Kidzy.Domain/**'
      - 'Kidzy.Infrastructure/**'
      - 'Kidzy.slnx'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build and push Docker image
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: kidzy-backend
          IMAGE_TAG: latest
        run: |
          docker build \
            -f Kidzy.API/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 5. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            aws ecr get-login-password --region ap-south-1 \
              | sudo docker login \
                --username AWS \
                --password-stdin \
                428270342093.dkr.ecr.ap-south-1.amazonaws.com

            sudo docker pull \
              428270342093.dkr.ecr.ap-south-1.amazonaws.com/kidzy-backend:latest

            sudo docker stop kidzy-backend || true
            sudo docker rm kidzy-backend || true

            sudo docker run -d \
              --name kidzy-backend \
              --restart unless-stopped \
              --env-file /home/ubuntu/kidzy-env-final.txt \
              -p 8080:8080 \
              428270342093.dkr.ecr.ap-south-1.amazonaws.com/kidzy-backend:latest

            sudo docker image prune -f
